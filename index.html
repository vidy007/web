<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>This is a test</title>
  <!-- Compiled from scss/style.scss -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>

  <main class="hero">
    <!-- Parent: the title moves along with the avatar -->
    <div class="hero__avatar">

      <!-- muted is required for autoplay -->
      <video class="hero__video" src="media/avatar.mp4"
             autoplay muted loop playsinline aria-hidden="true"></video>

      <h1 class="hero__title">
        <!-- Changing the text? Update $hello-width / $test-width in scss -->
        <span class="hero__hello">Hello</span>
        <span class="hero__test">I'm <span class="nickname">vaiedy</span></span>
      </h1>

    </div>
  </main>

</body>
</html>
