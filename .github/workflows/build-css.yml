# Compiles scss/ into css/style.css on push and commits the result
name: Build CSS

on:
  push:
    branches: [main]
    paths: ["scss/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install sassc
        run: sudo apt-get update -q && sudo apt-get install -y -q sassc

      - name: Compile
        run: sassc --style expanded scss/style.scss css/style.css

      - name: Commit if changed
        run: |
          git diff --quiet css/style.css && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild CSS" css/style.css
          git push
